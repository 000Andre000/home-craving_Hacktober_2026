services:
  - type: web
    name: home-craving
    runtime: python
    buildCommand: pip install -r requirements-hosted.txt   # light: all AI runs through hosted APIs
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - {key: LLM_BASE_URL, sync: false}
      - {key: LLM_MODEL, sync: false}
      - {key: LLM_API_KEY, sync: false}
      - {key: TABPFN_TOKEN, sync: false}
      - {key: ELEVENLABS_API_KEY, sync: false}
      - {key: SERPAPI_KEY, sync: false}